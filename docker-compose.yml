# Local stack. feat-018 adds the API, worker and UI; for now only the database.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage  # local demo value, never a real secret
      POSTGRES_DB: issue_triage
    ports:
      - "${ISSUE_TRIAGE_DB_PORT:-5433}:5432"
    volumes:
      - triage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d issue_triage"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  triage_pgdata:
