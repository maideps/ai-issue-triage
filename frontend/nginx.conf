server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The first request loads models and the search index.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
