name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CW_SKIP_ADOPTION_MATRIX: "1"
      ISSUE_TRIAGE_REQUIRE_DB: "1"
      ISSUE_TRIAGE_TEST_DATABASE_URL: postgresql+psycopg://triage:triage@localhost:5433/issue_triage_test
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: issue_triage
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U triage -d issue_triage"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and set up project
        run: npm run setup --if-present

      - name: Install the backend with dev tools
        run: npm run setup:backend

      - name: Verify project
        run: npm run check

      - name: Verify architecture
        run: npm run check-arch
